name: One-time localization hardening

on:
  push:
    branches:
      - documentary-dev
    paths:
      - .github/workflows/localization-hardening-once.yml
      - .github/localization_hardening_once.py

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out documentary-dev
        uses: actions/checkout@v4
        with:
          ref: documentary-dev
          fetch-depth: 0

      - name: Repair patch-runner payload anchor
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/localization_hardening_once.py')
          text = path.read_text(encoding='utf-8')
          label = '    "compact payload constraints",\n)'
          label_pos = text.index(label)
          start = text.rfind('source = replace_once(', 0, label_pos)
          end = text.index('\nsource = replace_once(', label_pos + len(label))
          replacement = '''old_payload = (
              '            "text": unit["text"],\\n'
              '            "next_source": _compact_consistency_text('
          )
          new_payload = (
              '            "text": unit["text"],\\n'
              '            "required_digit_tokens": sorted(\\n'
              '                _canonical_numeric_tokens(unit["text"]).elements()\\n'
              '            ),\\n'
              '            "required_number_word_spans": _source_number_word_spans(\\n'
              '                unit["text"],\\n'
              '                source_language,\\n'
              '            ),\\n'
              '            "required_protected_literals": sorted(\\n'
              '                _protected_literal_tokens(unit["text"])\\n'
              '            ),\\n'
              '            "next_source": _compact_consistency_text('
          )
          source = replace_once(
              source,
              old_payload,
              new_payload,
              "compact payload constraints",
          )
          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply iterative localization hardening
        run: python .github/localization_hardening_once.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.11

      - name: Compile and lint changed code
        run: |
          uv run --no-sync python -m compileall -q app/services/documentary/localization.py test/services/test_documentary_localization.py
          uv run --no-sync ruff check app/services/documentary/localization.py test/services/test_documentary_localization.py

      - name: Run localization and full documentary tests
        run: |
          uv run --no-sync pytest test/services/test_documentary_localization.py -q
          uv run --no-sync pytest test/services/test_documentary_*.py test/services/test_source_hunter.py test/services/test_story_discovery.py -q

      - name: Commit hardened implementation and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/localization-hardening-once.yml
          git rm .github/localization_hardening_once.py
          git add app/services/documentary/localization.py test/services/test_documentary_localization.py
          git commit -m "Harden localization generation and repair pipeline"
          git push origin HEAD:documentary-dev
