name: One-time localization hardening

on:
  push:
    branches:
      - documentary-dev
    paths:
      - .github/workflows/localization-hardening-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out documentary-dev
        uses: actions/checkout@v4
        with:
          ref: documentary-dev
          fetch-depth: 0

      - name: Apply iterative localization hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          localization_path = Path("app/services/documentary/localization.py")
          tests_path = Path("test/services/test_documentary_localization.py")
          source = localization_path.read_text(encoding="utf-8")
          tests = tests_path.read_text(encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)

          # Cycle 1: invalidate stale work/review decisions after policy changes.
          source = replace_once(
              source,
              "CURRENT_LOCALIZATION_REVIEW_VERSION = 5\n"
              "_LOCALIZATION_WORK_VERSION = 1\n"
              "_LOCALIZATION_WORK_REVIEW_POLICY_VERSION = 5",
              "CURRENT_LOCALIZATION_REVIEW_VERSION = 6\n"
              "# Bump when translation/checkpoint semantics change so an interrupted\n"
              "# run cannot silently reuse text produced by an older prompt policy.\n"
              "_LOCALIZATION_WORK_VERSION = 2\n"
              "# Bump whenever deterministic or semantic review policy changes.\n"
              "_LOCALIZATION_WORK_REVIEW_POLICY_VERSION = 6",
              "localization policy versions",
          )

          # Cycle 2: expose word-number and literal constraints to the initial translator.
          helper_anchor = '''def _compact_consistency_text(text: str, max_chars: int = 320) -> str:
              value = re.sub(r"\\s+", " ", str(text or "")).strip()
              if len(value) <= max_chars:
                  return value
              head = max_chars // 2
              tail = max_chars - head - 1
              return value[:head].rstrip() + "…" + value[-tail:].lstrip()


'''
          helper_replacement = helper_anchor + '''_EN_NUMBER_WORDS = {
              "zero", "one", "two", "three", "four", "five", "six", "seven",
              "eight", "nine", "ten", "eleven", "twelve", "thirteen",
              "fourteen", "fifteen", "sixteen", "seventeen", "eighteen",
              "nineteen", "twenty", "thirty", "forty", "fifty", "sixty",
              "seventy", "eighty", "ninety", "hundred", "thousand", "million",
              "billion", "first", "second", "third", "fourth", "fifth",
              "sixth", "seventh", "eighth", "ninth", "tenth", "eleventh",
              "twelfth", "thirteenth", "fourteenth", "fifteenth", "sixteenth",
              "seventeenth", "eighteenth", "nineteenth", "twentieth",
              "thirtieth", "fortieth", "fiftieth", "sixtieth", "seventieth",
              "eightieth", "ninetieth", "hundredth", "thousandth", "millionth",
              "billionth", "half", "quarter", "dozen", "score", "once", "twice",
          }


def _source_number_word_spans(text: str, source_language: str) -> list[str]:
              """Return contiguous English number/ordinal phrases for prompt constraints."""
              if _normalize_language(source_language).split("-", 1)[0] != "en":
                  return []

              value = str(text or "")
              matches = list(re.finditer(r"[A-Za-z]+(?:-[A-Za-z]+)*", value))
              spans: list[str] = []
              seen: set[str] = set()
              index = 0
              while index < len(matches):
                  token = matches[index].group(0).casefold()
                  parts = token.split("-")
                  if not all(part in _EN_NUMBER_WORDS for part in parts):
                      index += 1
                      continue

                  start = matches[index].start()
                  end = matches[index].end()
                  cursor = index + 1
                  while cursor < len(matches):
                      separator = value[end:matches[cursor].start()]
                      if not re.fullmatch(r"[\\s,-]*", separator):
                          break
                      next_token = matches[cursor].group(0).casefold()
                      next_parts = next_token.split("-")
                      if all(part in _EN_NUMBER_WORDS for part in next_parts):
                          end = matches[cursor].end()
                          cursor += 1
                          continue
                      if (
                          next_token == "and"
                          and cursor + 1 < len(matches)
                          and re.fullmatch(
                              r"[\\s,-]*",
                              value[matches[cursor].end():matches[cursor + 1].start()],
                          )
                          and all(
                              part in _EN_NUMBER_WORDS
                              for part in matches[cursor + 1].group(0).casefold().split("-")
                          )
                      ):
                          end = matches[cursor + 1].end()
                          cursor += 2
                          continue
                      break

                  span = value[start:end].strip()
                  key = span.casefold()
                  if span and key not in seen:
                      seen.add(key)
                      spans.append(span)
                  index = cursor
              return spans


'''
          source = replace_once(
              source,
              helper_anchor,
              helper_replacement,
              "number-word helper insertion",
          )

          source = replace_once(
              source,
              '''            "text": unit["text"],
              "next_source": _compact_consistency_text(''',
              '''            "text": unit["text"],
              "required_digit_tokens": sorted(
                  _canonical_numeric_tokens(unit["text"]).elements()
              ),
              "required_number_word_spans": _source_number_word_spans(
                  unit["text"],
                  source_language,
              ),
              "required_protected_literals": sorted(
                  _protected_literal_tokens(unit["text"])
              ),
              "next_source": _compact_consistency_text(''',
              "compact payload hard constraints",
          )

          source = replace_once(
              source,
              '''"consistency_context" contains earlier SOURCE→TRANSLATION examples only when the
          current item shares a repeated likely name/term with them. Use it ONLY to keep the
          same entity/name/term spelling consistent. Never import facts from those examples.

          FIDELITY RULES''',
              '''"consistency_context" contains earlier SOURCE→TRANSLATION examples only when the
          current item shares a repeated likely name/term with them. Use it ONLY to keep the
          same entity/name/term spelling consistent. Never import facts from those examples.
          "required_digit_tokens" are hard constraints: copy every listed digit token
          verbatim with identical multiplicity; never spell it out, convert units, round it,
          or replace it with an equivalent value. "required_number_word_spans" must preserve
          the exact cardinal/ordinal value and scope. "required_protected_literals" must be
          copied exactly.

          FIDELITY RULES''',
              "compact prompt hard-constraint explanation",
          )

          # Cycle 3: never checkpoint a translation before deterministic gates pass.
          old_localize_block = '''        def on_partial(partial: dict[int, str]) -> None:
              translations.update(partial)
              if checkpoint is not None:
                  checkpoint(translations)

          enriched_missing = _with_consistency_context(
              missing,
              all_units=units,
              translations=translations,
              repeated_keys=repeated_consistency_keys,
          )
          translations.update(
              _translate_compact_batch(
                  source_language=source_language,
                  target_language=target_language,
                  batch=enriched_missing,
                  generator=generator,
                  on_partial=on_partial,
              )
          )
          if checkpoint is not None:
              checkpoint(translations)
'''
          new_localize_block = '''        enriched_missing = _with_consistency_context(
              missing,
              all_units=units,
              translations=translations,
              repeated_keys=repeated_consistency_keys,
          )
          batch_translations = _translate_compact_batch(
              source_language=source_language,
              target_language=target_language,
              batch=enriched_missing,
              generator=generator,
              on_partial=None,
          )

          # Do not persist poisoned partial work. Repair hard factual violations
          # source-only before they enter the resumable checkpoint.
          for unit in enriched_missing:
              item_id = unit["i"]
              hard_issues = _hard_deterministic_review_issues(
                  [
                      {
                          "i": item_id,
                          "source": unit["text"],
                          "translation": batch_translations[item_id],
                      }
                  ]
              )
              if hard_issues:
                  batch_translations[item_id] = _literal_fidelity_repair(
                      generator=generator,
                      source_language=source_language,
                      target_language=target_language,
                      unit=unit,
                      issues=hard_issues,
                  )

          translations.update(batch_translations)
          if checkpoint is not None:
              checkpoint(translations)
'''
          source = replace_once(
              source,
              old_localize_block,
              new_localize_block,
              "validated compact checkpoint block",
          )

          # Cycle 4: make hard gates catch partial untranslated spans and suspicious size.
          old_hard_tail = '''        untranslated_issue = _untranslated_copy_issue(unit)
              if untranslated_issue:
                  issues.append(untranslated_issue)
              truncation_issue = _hard_truncation_issue(unit)
              if truncation_issue:
                  issues.append(truncation_issue)
          return issues
'''
          new_hard_tail = '''        untranslated_issue = _untranslated_copy_issue(unit)
              if untranslated_issue:
                  issues.append(untranslated_issue)
              copied_span_issue = _copied_source_span_issue(unit)
              if copied_span_issue:
                  issues.append(copied_span_issue)
              truncation_issue = _hard_truncation_issue(unit)
              if truncation_issue:
                  issues.append(truncation_issue)
              else:
                  length_issue = _suspicious_length_issue(unit)
                  if length_issue:
                      issues.append(length_issue)
          return issues
'''
          source = replace_once(
              source,
              old_hard_tail,
              new_hard_tail,
              "hard deterministic review tail",
          )

          # Cycle 5: isolate targeted repair from context that can inject facts.
          old_constraints = '''    required_literal_tokens = sorted(_protected_literal_tokens(source_text))
              hard_constraints = {
                  "required_digit_tokens_verbatim": required_digit_tokens,
                  "required_protected_literals_verbatim": required_literal_tokens,
              }

              previous, following = _repair_context_for_unit(
                  source_units,
                  unit,
              )
              previous = _compact_consistency_text(previous, max_chars=480)
              following = _compact_consistency_text(following, max_chars=480)
              repeated_keys = _repeated_consistency_keys(source_units)
              consistency_context = _with_consistency_context(
                  [unit],
                  all_units=source_units,
                  translations=translations,
                  repeated_keys=repeated_keys,
              )[0].get("consistency_context", [])
              position = next(
                  (
                      index
                      for index, candidate in enumerate(source_units)
                      if candidate["i"] == unit["i"]
                  ),
                  -1,
              )
'''
          new_constraints = '''    required_literal_tokens = sorted(_protected_literal_tokens(source_text))
              required_number_word_spans = _source_number_word_spans(
                  source_text,
                  source_language,
              )
              required_reviewer_source_spans = _review_source_span_hints(
                  source_text,
                  issues,
              )
              hard_constraints = {
                  "required_digit_tokens_verbatim": required_digit_tokens,
                  "required_number_word_spans": required_number_word_spans,
                  "required_protected_literals_verbatim": required_literal_tokens,
                  "required_reviewer_source_spans": required_reviewer_source_spans,
              }

              issue_blob = " ".join(str(issue) for issue in issues).casefold()
              context_is_risky = bool(
                  re.search(
                      r"added|not present|identity|wrong person|neighbor|"
                      r"next translation|previous translation|invented|hallucinat",
                      issue_blob,
                  )
              )
              if context_is_risky:
                  previous, following = "", ""
              else:
                  previous, following = _repair_context_for_unit(
                      source_units,
                      unit,
                  )
                  previous = _compact_consistency_text(previous, max_chars=480)
                  following = _compact_consistency_text(following, max_chars=480)

              consistency_only = bool(issues) and all(
                  re.search(r"consisten|anchor item|transliteration", str(issue), re.I)
                  for issue in issues
              )
              consistency_context = []
              if consistency_only:
                  repeated_keys = _repeated_consistency_keys(source_units)
                  consistency_context = _with_consistency_context(
                      [unit],
                      all_units=source_units,
                      translations=translations,
                      repeated_keys=repeated_keys,
                  )[0].get("consistency_context", [])
'''
          source = replace_once(
              source,
              old_constraints,
              new_constraints,
              "repair context isolation",
          )

          source = replace_once(
              source,
              '''If required_digit_tokens_verbatim is non-empty, EVERY listed digit token must appear
          verbatim in the corrected translation with the same value and multiplicity. Do not
          spell those digits out, round them, convert units, or substitute a nearby number.
          If required_protected_literals_verbatim is non-empty, preserve each listed literal
          exactly.
''',
              '''If required_digit_tokens_verbatim is non-empty, EVERY listed digit token must appear
          verbatim in the corrected translation with the same value and multiplicity. Do not
          spell those digits out, round them, convert units, or substitute a nearby number.
          Preserve the exact cardinal/ordinal value and scope of every
          required_number_word_spans entry. Explicitly represent every
          required_reviewer_source_spans entry in the corrected translation. If
          required_protected_literals_verbatim is non-empty, preserve each listed literal
          exactly.
''',
              "repair constraint instructions",
          )

          # Extend literal mode with number-word spans and resilient schema retries.
          source = replace_once(
              source,
              '''    required_spans = _review_source_span_hints(source_text, issues)
              return f"""
''',
              '''    required_spans = _review_source_span_hints(source_text, issues)
              for span in _source_number_word_spans(source_text, source_language):
                  if span.casefold() not in {item.casefold() for item in required_spans}:
                      required_spans.append(span)
              return f"""
''',
              "literal number-word spans",
          )

          old_literal_signature = '''def _literal_fidelity_repair(
              *,
              generator: Callable[[str], str],
              source_language: str,
              target_language: str,
              unit: dict,
              issues: list[str],
          ) -> str:
              last_issues = list(issues)
              for _ in range(3):
                  response = generator(
                      _build_literal_fidelity_repair_prompt(
                          source_language=source_language,
                          target_language=target_language,
                          unit=unit,
                          issues=last_issues,
                      )
                  )
                  repaired = _parse_compact_localization_response(response, [unit])
                  text = str(repaired.get(unit["i"]) or "").strip()
                  if not text:
                      continue
                  hard_issues = _hard_deterministic_review_issues(
                      [
                          {
                              "i": unit["i"],
                              "source": unit["text"],
                              "translation": text,
                          }
                      ]
                  )
                  if not hard_issues:
                      return text
                  last_issues = [*issues, *hard_issues]

              raise _LocalizationSemanticError(
                  "literal repair could not satisfy deterministic factual constraints for "
                  f"item {unit['i']}: "
                  + "; ".join(last_issues[-4:])
              )
'''
          new_literal_signature = '''def _literal_fidelity_repair(
              *,
              generator: Callable[[str], str],
              source_language: str,
              target_language: str,
              unit: dict,
              issues: list[str],
              reviewer: Callable[[str], str] | None = None,
          ) -> str:
              last_issues = list(issues)
              last_hard_valid_text = ""
              for _ in range(3):
                  try:
                      response = generator(
                          _build_literal_fidelity_repair_prompt(
                              source_language=source_language,
                              target_language=target_language,
                              unit=unit,
                              issues=last_issues,
                          )
                      )
                      repaired = _parse_compact_localization_response(response, [unit])
                  except _LocalizationSchemaError as exc:
                      last_issues = [*issues, f"item {unit['i']}: {exc}"]
                      continue

                  text = str(repaired.get(unit["i"]) or "").strip()
                  if not text:
                      last_issues = [
                          *issues,
                          f"item {unit['i']}: literal repair returned empty text",
                      ]
                      continue

                  hard_issues = _hard_deterministic_review_issues(
                      [
                          {
                              "i": unit["i"],
                              "source": unit["text"],
                              "translation": text,
                          }
                      ]
                  )
                  if hard_issues:
                      last_issues = [*issues, *hard_issues]
                      continue

                  last_hard_valid_text = text
                  if reviewer is None:
                      return text

                  semantic_issues = _run_final_materiality_review_item(
                      reviewer=reviewer,
                      source_language=source_language,
                      target_language=target_language,
                      unit={
                          "i": unit["i"],
                          "source": unit["text"],
                          "translation": text,
                          "previous_source": "",
                          "next_source": "",
                      },
                  )
                  if not semantic_issues:
                      return text
                  last_issues = [*issues, *semantic_issues]

              # A hard-valid candidate is safer than throwing it away because a
              # semantic reviewer remained noisy. The outer materiality gate will
              # independently review it again before the plan is accepted.
              if last_hard_valid_text:
                  return last_hard_valid_text

              raise _LocalizationSemanticError(
                  "literal repair could not satisfy deterministic factual constraints for "
                  f"item {unit['i']}: "
                  + "; ".join(last_issues[-4:])
              )
'''
          source = replace_once(
              source,
              old_literal_signature,
              new_literal_signature,
              "resilient literal repair",
          )

          # One context-aware attempt, then immediately switch to source-only literal mode.
          old_single = '''def _repair_single_localization_item(
              *,
              generator: Callable[[str], str],
              source_language: str,
              target_language: str,
              unit: dict,
              source_units: list[dict],
              translations: dict[int, str],
              current_translation: str,
              issues: list[str],
          ) -> str:
              repair_issues = list(issues)
              candidate_translation = current_translation

              # A repaired item must pass deterministic factual gates BEFORE it is accepted
              # into the localization. This prevents cycles where the model "repairs" 110
              # miles into 152.50 km, drops a digit, leaves source prose untranslated, etc.,
              # only for the next reviewer pass to rediscover the same hard error.
              for _ in range(3):
                  response = generator(
                      _build_single_item_repair_prompt(
                          source_language=source_language,
                          target_language=target_language,
                          unit=unit,
                          source_units=source_units,
                          translations=translations,
                          current_translation=candidate_translation,
                          issues=repair_issues,
                      )
                  )
                  repaired = _parse_compact_localization_response(
                      response,
                      [unit],
                  )
                  text = str(repaired.get(unit["i"]) or "").strip()
                  if not text:
                      raise _LocalizationSchemaError(
                          f"localization repair returned no text for item {unit['i']}"
                      )

                  hard_issues = _hard_deterministic_review_issues(
                      [
                          {
                              "i": unit["i"],
                              "source": unit["text"],
                              "translation": text,
                          }
                      ]
                  )
                  if not hard_issues:
                      return text

                  candidate_translation = text
                  repair_issues = [
                      *issues,
                      *hard_issues,
                      (
                          f"item {unit['i']}: previous repair failed mandatory machine "
                          "checks; correct every listed hard constraint before returning"
                      ),
                  ]

              # The ordinary repair prompt is intentionally comprehensive, but some models
              # still get stuck repeating the same omission/conversion. Switch this one item
              # to a minimal source-only literal mode instead of aborting the whole film.
              return _literal_fidelity_repair(
                  generator=generator,
                  source_language=source_language,
                  target_language=target_language,
                  unit=unit,
                  issues=repair_issues,
              )
'''
          new_single = '''def _repair_single_localization_item(
              *,
              generator: Callable[[str], str],
              source_language: str,
              target_language: str,
              unit: dict,
              source_units: list[dict],
              translations: dict[int, str],
              current_translation: str,
              issues: list[str],
              reviewer: Callable[[str], str] | None = None,
          ) -> str:
              response = generator(
                  _build_single_item_repair_prompt(
                      source_language=source_language,
                      target_language=target_language,
                      unit=unit,
                      source_units=source_units,
                      translations=translations,
                      current_translation=current_translation,
                      issues=issues,
                  )
              )
              repaired = _parse_compact_localization_response(response, [unit])
              text = str(repaired.get(unit["i"]) or "").strip()
              if not text:
                  raise _LocalizationSchemaError(
                      f"localization repair returned no text for item {unit['i']}"
                  )

              hard_issues = _hard_deterministic_review_issues(
                  [
                      {
                          "i": unit["i"],
                          "source": unit["text"],
                          "translation": text,
                      }
                  ]
              )
              if not hard_issues:
                  return text

              return _literal_fidelity_repair(
                  generator=generator,
                  source_language=source_language,
                  target_language=target_language,
                  unit=unit,
                  issues=[
                      *issues,
                      *hard_issues,
                      (
                          f"item {unit['i']}: context-aware repair failed mandatory "
                          "machine checks; use source-only literal repair"
                      ),
                  ],
                  reviewer=reviewer,
              )
'''
          source = replace_once(
              source,
              old_single,
              new_single,
              "single-item repair strategy",
          )

          # Schema drift goes to strict literal mode; provider/runtime failures remain fatal.
          source = replace_once(
              source,
              '''    issues: list[str],
              status: LocalizationStatusCallback | None = None,
''',
              '''    issues: list[str],
              reviewer: Callable[[str], str] | None = None,
              status: LocalizationStatusCallback | None = None,
''',
              "repair batch reviewer parameter",
          )
          source = replace_once(
              source,
              '''                current_translation=translations.get(unit["i"], ""),
                  issues=_issues_for_item(issues, unit["i"]),
              )
          except (_LocalizationSchemaError, _NonRetryableLocalizationError):
              # Preserve isolation even if the strict repair format drifts: fall back
              # to the ordinary translator for this one item only, never the batch.
              translated = _translate_compact_batch(
                  source_language=source_language,
                  target_language=target_language,
                  batch=[unit],
                  generator=generator,
              )
              repaired[unit["i"]] = translated[unit["i"]]
''',
              '''                current_translation=translations.get(unit["i"], ""),
                  issues=_issues_for_item(issues, unit["i"]),
                  reviewer=reviewer,
              )
          except _LocalizationSchemaError as exc:
              repaired[unit["i"]] = _literal_fidelity_repair(
                  generator=generator,
                  source_language=source_language,
                  target_language=target_language,
                  unit=unit,
                  issues=[
                      *_issues_for_item(issues, unit["i"]),
                      f"item {unit['i']}: {exc}",
                  ],
                  reviewer=reviewer,
              )
          except _NonRetryableLocalizationError:
              raise
''',
              "repair batch exception handling",
          )

          # Pass the independent reviewer into both production repair paths.
          source = source.replace(
              '''                issues=batch_issues,
                  status=status,
''',
              '''                issues=batch_issues,
                  reviewer=reviewer,
                  status=status,
''',
              1,
          )
          if source.count('''                issues=consistency_issues,
                  status=status,
''') != 1:
              raise RuntimeError("global consistency repair call anchor mismatch")
          source = source.replace(
              '''                issues=consistency_issues,
                  status=status,
''',
              '''                issues=consistency_issues,
                  reviewer=reviewer,
                  status=status,
''',
              1,
          )

          # Tests: update the quicker fallback expectation and add regression coverage.
          tests = replace_once(
              tests,
              '''    assert len(calls) == 4
              assert "EMERGENCY LITERAL FIDELITY REPAIR" in calls[-1]
''',
              '''    assert len(calls) == 2
              assert "EMERGENCY LITERAL FIDELITY REPAIR" in calls[-1]
''',
              "literal fallback call count",
          )

          extra_tests = r'''


def test_review_policy_and_work_cache_versions_advance_together():
              from app.services.documentary.localization import (
                  _LOCALIZATION_WORK_REVIEW_POLICY_VERSION,
                  _LOCALIZATION_WORK_VERSION,
              )

              assert CURRENT_LOCALIZATION_REVIEW_VERSION >= 6
              assert _LOCALIZATION_WORK_REVIEW_POLICY_VERSION == CURRENT_LOCALIZATION_REVIEW_VERSION
              assert _LOCALIZATION_WORK_VERSION >= 2


def test_compact_prompt_exposes_per_item_machine_constraints():
              prompt = _build_compact_localization_prompt(
                  source_language="en",
                  target_language="ru",
                  batch=[
                      {
                          "i": 2,
                          "kind": "narration",
                          "previous_text": "",
                          "text": "At 7 on Christmas Eve, seven people waited.",
                          "next_text": "",
                          "consistency_context": [],
                      }
                  ],
              )

              assert '"required_digit_tokens":["7"]' in prompt
              assert '"required_number_word_spans":["seven"]' in prompt
              assert "copy every listed digit token" in prompt


def test_repair_drops_risky_neighbor_and_consistency_context():
              unit = {
                  "i": 170,
                  "scene_index": 1,
                  "kind": "narration",
                  "text": "Camila's mother continued searching.",
                  "previous_text": "Rosario spoke to reporters.",
                  "next_text": "Volunteers joined later.",
              }
              prompt = _build_single_item_repair_prompt(
                  source_language="en",
                  target_language="ru",
                  unit=unit,
                  source_units=[
                      {
                          "i": 169,
                          "scene_index": 0,
                          "kind": "narration",
                          "text": "Rosario spoke to reporters.",
                          "previous_text": "",
                          "next_text": unit["text"],
                      },
                      unit,
                  ],
                  translations={169: "Росарио поговорила с журналистами."},
                  current_translation="Росарио продолжила поиски.",
                  issues=[
                      "item 170: added person/entity identity not present in source"
                  ],
              )

              assert "CURRENT SOURCE:\nCamila's mother continued searching." in prompt
              assert "PREVIOUS SOURCE:\n\n" in prompt
              assert "NEXT SOURCE:\n\n" in prompt
              assert "Росарио поговорила с журналистами" not in prompt


def test_literal_repair_retries_after_schema_drift():
              from app.services.documentary.localization import _literal_fidelity_repair

              unit = {
                  "i": 2,
                  "scene_index": 0,
                  "kind": "narration",
                  "text": "At 7 on Christmas Eve, the family waited.",
              }
              calls = []

              def generate(prompt: str) -> str:
                  calls.append(prompt)
                  if len(calls) == 1:
                      return "not json"
                  return json.dumps(
                      {
                          "items": [
                              {
                                  "i": 2,
                                  "text": "В 7 часов в канун Рождества семья ждала.",
                              }
                          ]
                      },
                      ensure_ascii=False,
                  )

              repaired = _literal_fidelity_repair(
                  generator=generate,
                  source_language="en",
                  target_language="ru",
                  unit=unit,
                  issues=["item 2: omitted 7 and Christmas Eve"],
              )

              assert len(calls) == 2
              assert "7" in repaired
              assert "канун Рождества" in repaired


