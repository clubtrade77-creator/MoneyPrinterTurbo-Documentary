name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - documentary-dev

permissions:
  contents: write

jobs:
  localization-audit-2:
    name: Second localization hardening audit
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/documentary-dev' &&
      contains(github.event.head_commit.message, '[localization-audit-2]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out documentary-dev
        uses: actions/checkout@v4
        with:
          ref: documentary-dev
          fetch-depth: 1

      - name: Apply audit fixes
        run: |
          python .github/run_localization_audit_round2.py
          python .github/localization_audit_round2_postfix.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.11

      - name: Compile and lint localization code
        run: |
          uv run --no-sync python -m compileall -q app/services/documentary/localization.py test/services/test_documentary_localization.py
          uv run --no-sync ruff check app/services/documentary/localization.py test/services/test_documentary_localization.py

      - name: Run localization tests
        run: uv run --no-sync pytest test/services/test_documentary_localization.py -q

      - name: Run full documentary tests
        run: >-
          uv run --no-sync pytest -q
          test/services/test_documentary_*.py
          test/services/test_source_hunter.py
          test/services/test_story_discovery.py

      - name: Commit hardened implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/documentary/localization.py test/services/test_documentary_localization.py
          git commit -m "Complete second localization hardening audit"
          git push origin HEAD:documentary-dev

  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MPT_TEST_REDIS_HOST: 127.0.0.1
      MPT_TEST_REDIS_PORT: 6379
      MPT_TEST_REDIS_DB: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall app cli.py main.py webui test docs/skill

      - name: Lint Python sources
        if: matrix.python-version == '3.11'
        run: uv run --no-sync ruff check app cli.py main.py webui test docs/skill

      - name: Run unit tests with coverage
        # pytest 兼容现有 unittest.TestCase，同时会收集仓库中的 pytest 风格
        # тесты, чтобы существующие тестовые файлы действительно запускались в CI.
        run: uv run --no-sync python -X utf8 -m coverage run -m pytest -q test

      - name: Report test coverage
        run: uv run --no-sync python -m coverage report

      - name: Export coverage report
        run: uv run --no-sync python -m coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  windows-smoke:
    name: Windows smoke tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.11

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall app cli.py main.py webui test docs/skill

      - name: Run core service smoke tests
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_config.py
          test/services/test_state.py
          test/services/test_task.py
          test/services/test_task_manager.py
          test/services/test_upload_post.py
          test/services/test_controller_video.py
          test/services/test_webui_task.py
          test/services/test_webui_headless_task_actions.py
