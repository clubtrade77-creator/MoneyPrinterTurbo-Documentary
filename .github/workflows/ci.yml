name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - documentary-dev

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-windows-smoke:
    name: Fix Windows smoke compatibility
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/documentary-dev' &&
      contains(github.event.head_commit.message, '[fix-windows-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out documentary-dev
        uses: actions/checkout@v4
        with:
          ref: documentary-dev
          fetch-depth: 1

      - name: Apply compatibility fixes
        run: python .github/fix_windows_smoke.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.11

      - name: Compile and lint changed files
        run: |
          uv run --no-sync python -m compileall -q webui/Main.py test/services/test_webui_task.py test/services/test_webui_headless_task_actions.py
          uv run --no-sync ruff check webui/Main.py test/services/test_webui_task.py test/services/test_webui_headless_task_actions.py

      - name: Run affected tests
        run: >-
          uv run --no-sync pytest -q
          test/services/test_webui_task.py
          test/services/test_webui_headless_task_actions.py

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webui/Main.py test/services/test_webui_task.py
          git commit -m "Fix Streamlit workspace state and download test"
          git push origin HEAD:documentary-dev

  tests:
    name: Python ${{ matrix.python-version }} tests
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[fix-windows-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MPT_TEST_REDIS_HOST: 127.0.0.1
      MPT_TEST_REDIS_PORT: 6379
      MPT_TEST_REDIS_DB: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall app cli.py main.py webui test docs/skill

      - name: Lint Python sources
        if: matrix.python-version == '3.11'
        run: uv run --no-sync ruff check app cli.py main.py webui test docs/skill

      - name: Run unit tests with coverage
        run: uv run --no-sync python -X utf8 -m coverage run -m pytest -q test

      - name: Report test coverage
        run: uv run --no-sync python -m coverage report

      - name: Export coverage report
        run: uv run --no-sync python -m coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  windows-smoke:
    name: Windows smoke tests
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[fix-windows-smoke]')
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.11

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall app cli.py main.py webui test docs/skill

      - name: Run core service smoke tests
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_config.py
          test/services/test_state.py
          test/services/test_task.py
          test/services/test_task_manager.py
          test/services/test_upload_post.py
          test/services/test_controller_video.py
          test/services/test_webui_task.py
          test/services/test_webui_headless_task_actions.py
